paths:
  /ws/product-definitions/{bpCode}:
    get:
      tags:
        - produktPodpora
      summary: Metóda definiceProduktu
      description: ''
      operationId: product-definition
      responses:
        '200':
          description: get product-definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDefinitionResponsePD'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNotFound'
        '422':
          description: >-
            Request je syntakticky OK, ale vyskytla se chyba za běhu (
            nesouhlasí typ operandu, dělení nulou, atd. )
        '429':
          description: >-
            Service je přetížena, aktuální request je ignorován, zkuste to za
            chvíli znovu
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
  /products/{bpCode}/lovs:
    get:
      tags:
        - produktPodpora
      summary: Metóda číselníky
      description: >-
        Vrátí seznam všech relevantních číselníku a jejích aktuálně platných
        položek pro definovanový produkt pomocí produktového kódu a volitelně
        verze produktu.
      operationId: getProductLovs
      parameters:
        - $ref: '#/components/parameters/HeaderCorrelationId'
        - $ref: '#/components/parameters/HeaderActivityId'
        - name: bpCode
          in: path
          description: Business product code
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: bpVariant
          in: query
          description: More granular selection for PD
          required: true
          style: form
          explode: true
          schema:
            type: string
        - name: bpVersion
          in: query
          description: Business product version
          required: false
          style: form
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: Získání seznamu číselníků i s platnými hodnotami
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLovsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
          - oauth2
        optional: false
