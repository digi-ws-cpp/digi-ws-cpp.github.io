openapi: 3.0.0
info:
  title: Webové služby
  description: >
    Tato služba slouží jako **Product Definition API**. Jejím hlavním účelem je
    poskytovat kompletní technickou a byznysovou definici produktu na základě
    jeho kódu.
  version: 1.39.0
security:
  - default: []
tags:
  - name: Základní informace
    x-traitTag: true
    description: >
      ### Popis služby

      Tento endpoint vrací **kompletní technickou a byznysovou definici
      produktu** na základě jeho unikátního kódu. 

      ### Klíčové vlastnosti:

      Formát odpovědi: **JSON**.

      * **Účel:** Slouží jako "návod" nebo "šablona" pro klientské aplikace.

      * **Využití v UI:** Na základě dat z tohoto endpointu se dynamicky
      sestavuje uživatelské rozhraní (např. formulářová pole).

      * **Validace:** Obsahuje pravidla, která aplikace aplikuje pro validaci
      vstupů od uživatele.

      * **Návaznost:** Připravuje datovou strukturu nezbytnou pro následné
      volání kalkulačky (výpočet pojistného/ceny).
  - name: Integrace JSON struktur v SOAP rozhraní
    x-traitTag: true
    description: "U nově zaváděných produktů (např. **Domex++**) dochází k evoluci v architektuře odpovědi služby definiceProduktu. Původní koncept, který využíval vnořené XML struktury uvnitř sekcí CDATA, je nahrazován modernějším přístupem, kde je kompletní byznysová definice předávána jako **serializovaný JSON objekt**.\n\n ### Klíčové principy a změny\n Tento „hybridní“ přístup kombinuje stabilitu stávajícího SOAP rozhraní s flexibilitou moderního datového formátu JSON:\n * **Transportní vrstva:** Nadále zůstává zachována XML obálka protokolu SOAP (Envelope/Body).\n *\t**Element <xmlData>:** U produktů využívajících modernizovaný formát je tento element prázdný (často označen jako xsi:nil=\"true\").\n *\t**Nový element <jsonData>:** Tento kontejner nově nese veškerá byznysová data. Obsahuje kompletní serializovaný JSON string se všemi atributy, pravidly a validační logikou produktu.\n \n ### Srovnání datových formátů\n \n #### Původní formát (Legacy XML)\n Starší produkty využívají pro přenos byznysových dat element <xmlData>. Obsah je zabalen do sekce CDATA, aby nedocházelo ke kolizi s parsováním SOAP obálky, a vnitřní struktura je tvořena čistým XML.\n \n ##### Ukázka struktury (Legacy: obecná definice číselníků):\n ```xml\n <S:Envelope xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/\">\n   <S:Body>\n       <ns2:definiceProduktuResponse xmlns:ns2=\"http://produkt.app.ws.knz.aisservis.cz/\">\n         <definiceProduktu>\n             <xmlData>\n               <![CDATA[<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n               <ciselniky>\n                 <ciselnik typ=\"casove_urceni\">\n                   <polozka hodnota=\"SEZONA\" popis=\"Sezónní pojištění\"/>\n                   <polozka hodnota=\"KRATKODOBE\" popis=\"Krátkodobé pojištění\"/>\n                   <polozka hodnota=\"VYVOZ\" popis=\"Vývoz vozidla mimo území ČR\"/>\n                   <polozka hodnota=\"DOVOZ\" popis=\"Dovoz vozidla z EU a EHP\"/>\n                   <polozka hodnota=\"DOVOLENA\" popis=\"Pojištění na dovolenou\"/>\n                 </ciselnik>\n                 <ciselnik typ=\"frekvence_placeni\">\n                   <polozka hodnota=\"ROCNI\" popis=\"Roční\"/>\n                   <polozka hodnota=\"POLOLETNI\" popis=\"Pololetní\"/>\n                   <polozka hodnota=\"CTVRTLETNI\" popis=\"Čtvrtletní\"/>\n                   <polozka hodnota=\"JEDNORAZOVA\" popis=\"Jednorázová\"/>\n                 </ciselnik>\n                 <ciselnik typ=\"pocet_mesicu_pojisteni\">\n                   <polozka hodnota=\"1\" popis=\"1\"/>\n                   <polozka hodnota=\"2\" popis=\"2\"/>\n                   <polozka hodnota=\"12\" popis=\"12\"/>\n                 </ciselnik>\n               </ciselniky>]]>\n             </xmlData>\n             <verze>1.0</verze>\n         </definiceProduktu>\n       </ns2:definiceProduktuResponse>\n   </S:Body>\n </S:Envelope>\n ```\n \n #### Nový formát (JSON v SOAP)\n U nových produktů je element `<xmlData>` prázdný a veškerá byznysová logika je přesunuta do strukturovaného JSON objektu v elementu `<jsonData>`.\n \n ##### Ukázka struktury (Domex++):\n\n ```xml\n     <xmlData>\n       <S:Envelope xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/\">\n   <S:Body>\n     <ns2:definiceProduktuResponse xmlns:ns2=\"http://produkt.app.ws.knz.aisservis.cz/\">\n       <definiceProduktu>\n           <xmlData xsi:nil=\"true\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"/>\n           <verze>1.31.0</verze>\n           <jsonData>\n           {\n             \"product\": {\n               \"businessProductCode\": \"Domex\",\n               \"premiumCalculationBase\": \"R\",\n               \"inceptionDateAndTimeRules\": {\n                 \"variableInceptionDateAllowed\": false,\n                 \"retroactiveInceptionDateAllowed\": false,\n                 \"methodForInception\": \"1\"\n               },\n               \"policy\": {\n                 \"inceptionDateInput\": {\n                   \"mandatory\": { \"default\": true },\n                   \"type\": \"datetime\"\n                 }\n               }\n             }\n           }\n           </jsonData>\n       </definiceProduktu>\n     </ns2:definiceProduktuResponse>\n   </S:Body>\n       </S:Envelope>\n     </xmlData>\n ```\n"
  - name: Technologie a způsob volání
    x-traitTag: true
    description: >
      Služba ProduktPodpora (Product Definition API) je navržena jako robustní
      rozhraní pro poskytování kompletních technických a byznysových definic
      pojistných produktů. Tato kapitola popisuje standardní protokol a nezbytné
      parametry pro úspěšné volání služby.  

      ## Typ volání (SOAP)

      Na rozdíl od standardních **REST** endpointů využívá tato služba pro
      komunikaci protokol **SOAP**

      * Formát dat: Veškerá data jsou přenášena výhradně v XML formátu.

      * Zapouzdření: Data jsou zasílána v rámci standardní XML obálky uvnitř
      elementu `soapenv:Envelope`.

      ## Autentizace

      Služba nevyužívá pro ověření identity standardní HTTP hlavičky (např.
      Bearer token nebo Basic Auth). Autentizace je implementována přímo v
      hlavičce XML obálky `<soapenv:Header>`.

      V každém požadavku musí být přítomen element ws_ucet, který obsahuje:

      * jmeno: Přihlašovací jméno přidělené správcem systému.

      * heslo: Heslo odpovídající danému účtu.

      ##### Příklad autentizační hlavičky:


      ```xml

      <soapenv:Header>
       <prod:ws_ucet xmlns:prod="http://produkt.app.ws.knz.aisservis.cz/">
         <jmeno>UŽIVATELSKÉ_JMÉNO</jmeno>
         <heslo>HESLO</heslo>
       </prod:ws_ucet>
      </soapenv:Header>


      ```

      ## Technické požadavky na HTTP klienta

      Při implementaci volání je nutné zajistit, aby HTTP klient korektně
      nastavil následující parametry, jinak bude požadavek serverem odmítnut:

      Content-Type: Musí být nastaven na `text/xml;charset=UTF-8`.
