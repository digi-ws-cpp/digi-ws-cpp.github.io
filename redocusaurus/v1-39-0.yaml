      ### Příklad requestu

      Samotné byznysové volání metody (např. definiceProduktu) se nachází v
      části `<soapenv:Body>`.

      ##### Příklad requestu:

      ```xml
       <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:prod="http://produkt.app.ws.knz.aisservis.cz/">
       <soapenv:Header>
       <prod:ws_ucet>
       <jmeno>UŽIVATELSKÉ_JMÉNO</jmeno>
       <heslo>HESLO</heslo>
       </prod:ws_ucet>
       </soapenv:Header>
       <soapenv:Body>
       <prod:definiceProduktu>
       <kod>D01</kod>
       <nadrazena_smlouva>N0001</nadrazena_smlouva>
       </prod:definiceProduktu>
       </soapenv:Body>
       </soapenv:Envelope>
      ```
