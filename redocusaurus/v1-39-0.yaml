      description: >-
        Odpověď volaní product-service, která obsahuje status a případné
        validační hlášky
    ProductDefinitionPD:
      type: object
      properties:
        inceptionDateAndTimeRules:
          $ref: '#/components/schemas/InceptionDateAndTimeRulesPD'
        premiumCalculationBase:
          type: string
          description: >
            **Báze kalkulace pojistného**

            > **Definice:** Atribut vychází z číselníku
            lov_premium_calculation_base a určuje časový nebo výpočtový základ,
            podle kterého se počítá pojistné.Nejčastěji se používá roční báze,
            ale může být i měsíční nebo jednorázová.R – ročníM – měsíčníJ –
            jednorázováJednorázová báze se používá například u cestovního
            pojištění, kde se sazba za den násobí počtem dní, takže výsledkem je
            jednorázové pojistné za celé období.
        offerFixationAllowed:
          type: boolean
          description: >
            **Fixace nabídky povolena**

            > **Definice:** Atribut určuje, zda může být nabídka pojistné
            smlouvy zafixována tedy zda lze uzamknout cenu a podmínky nabídky na
            určité období.Pokud je hodnota true, lze nabídku zafixovat a
            klientovi garantovat, že smlouvu bude možné sjednat dle stavu, kdy
            byla nabídka vytvořena. Pokud je hodnota false, uživatel (získatel)
            nemůže nabídku zamknout a cena se může kdykoliv přepočítat (např. po
            změně tarifů nebo při opětovném otevření návrhu). Fixaci nabídky je
            možné provést pouze tehdy, je-li povolena u daného produktu.
            Současně je definován atribut maximumFixationDayNumber, který určuje
            maximální počet dní, po které lze nabídku fixovat.
        methodForFixedPeriod:
          type: string
          description: >
            **Metoda určení data konce pro dobu určitou**

            > **Definice:** Atribut řídí, jakým způsobem se určuje datum
            ukončení pojistné smlouvy (PS). Hodnota atributu vychází z
            číselníku. Má smysl jej definovat pouze v případě, že je produkt
            nastaven na pojistnou dobu určitou. Pokud tato možnost není
            povolena, atribut nebude vyplněn ani zahrnut v definici produktu.
        forwardMaximumDayNumber:
          type: number
          description: >
            **Maximální počet dní do budoucna**

            > **Definice:** Atribut stanovuje, o kolik dní dopředu lze nastavit
            datum předložení návrhu vůči aktuálnímu datu.Datum předložení návrhu
            představuje okamžik, kdy byl návrh pojistné smlouvy předložen
            klientovi k akceptaci.V systému se eviduje jak datum, tak i čas
            předložení návrhu.Tento atribut tedy určuje maximální povolený počet
            dní do budoucna, o které může být návrh předložen oproti dnešnímu
            datu
        maximumFixationDayNumber:
          type: number
          description: >
            **Maximální počet dní do budoucna**

            > **Definice:** Atribut určuje, na jak dlouho lze zafixovat stav
            nabídky pojistné smlouvy, tedy garantovat klientovi, že po tuto dobu
            bude možné smlouvu sjednat podle podmínek platných při vytvoření
            nabídky.Fixaci nabídky lze provést pouze tehdy, je-li u produktu
            povolena (atribut offerFixationAllowed = true).Hodnota tohoto
            atributu určuje maximální dobu fixace v kalendářních dnech.
        proposalMaximumDayNumber:
          type: number
          description: >
            **Maximální počet dní přijetí návrhu**

            > **Definice:** Atribut stanovuje, do kdy může pojistník přijmout
            návrh pojistné smlouvy.Pokud k přijetí návrhu nedojde ve stanovené
            lhůtě, návrh zaniká.Způsob výpočtu termínu přijetí návrhu je určen
            pravidly produktu, která zohledňují metodu uzavření smlouvy a další
            parametry.V některých případech nemusí být termín přijetí návrhu
            stanoven — tehdy je systémově uloženo datum a čas „na
            neurčito“.Pokud má smlouva příznak plovoucího počátku, použije se
            alternativní atribut proposalMaximumDayNumberVariableInceptionDate.V
            systému se eviduje datum i čas termínu pro přijetí návrhu.
        proposalMaximumDayNumberVariableInceptionDate:
          type: number
          description: >
            **Max. počet dní přijetí návrhu pro variabilní počátek**

            > **Definice:** Atribut určuje, do kdy může být přijat návrh
            pojistné smlouvy, pokud má smlouva příznak plovoucího počátku
            (variableInceptionDateAllowed = true).V takovém případě se pro
            výpočet termínu použije tato hodnota místo standardního atributu
            proposalMaximumDayNumber.Pokud variabilní počátek není povolen,
            využije se běžný termín přijetí návrhu definovaný atributem
            proposalMaximumDayNumber.Termín přijetí návrhu určuje poslední den,
            kdy může pojistník návrh akceptovat, jinak návrh zaniká.
        acquisitionAgentProficiencyLevelLife:
          type: string
          description: >
            **Odbornost získatele životní**

            > **Definice:** Atribut vychází z číselníku
            lov_acquisition_agent_proficiency_level_life a stanovuje, zda musí
            mít získatel zkoušku odborné způsobilosti pro životní pojištění
            podle zákona č. 170/2018 Sb. o distribuci pojištění a zajištění.Od
            1. 12. 2018 musí mít každý získatel splněnou příslušnou zkoušku
            odbornosti pro skupinu pojištění, kterou sjednává.Tento atribut se
            zaměřuje výhradně na životní pojištění a nabývá následujících
            hodnot:0  Není nutná odbornost č. 1 (životní pojištění).1 Je nutná
            odbornost č. 1 (životní pojištění).Atribut se používá v kombinaci s
            atributem acquisitionAgentProficiencyLevelMinimumNL, který určuje
            požadavky na odbornost pro neživotní pojištění.
        acquisitionAgentProficiencyLevelMinimumNL:
          type: string
          description: >
            **Minimální odbornost získatele neživotní**

            > **Definice:** Atribut vychází z číselníku
            lov_acquisition_agent_proficiency_level_minimum_nl a stanovuje,
            jakou minimální úroveň odborné způsobilosti musí mít získatel podle
            zákona č. 170/2018 Sb. o distribuci pojištění a zajištění. Odbornost
            získatele je rozdělena do pěti úrovní: distribuce životního
            pojištění distribuce pojištění škod na pozemních vozidlech a
            odpovědnosti z provozu distribuce neživotního pojištění
            (obecně)distribuce neživotního pojištění týkající se podnikatelské
            činnosti distribuce pojištění velkých pojistných rizik. Atribut se
            vztahuje pouze na neživotní pojištění a určuje minimální požadovanou
            úroveň odbornosti, kterou musí mít získatel, aby mohl produkt
            sjednat. Vyšší úroveň automaticky zahrnuje nižší. Možné hodnoty:0
            Není nutná neživotní odbornost2 Minimální neživotní odbornost č. 23
            Minimální neživotní odbornost č. 34 Minimální neživotní odbornost č.
            45 Minimální neživotní odbornost č. 5 Tento atribut se používá
            společně s acquisitionAgentProficiencyLevelLife k určení odborných
            požadavků pro sjednávání produktu.
        insurancePeriod:
          type: string
          description: >
            **Pojistné období**

            > **Definice:** Atribut vychází z číselníku lov_insurance_period a
            obvykle má hodnotu R (roční), pokud není stanoveno jinak. Pojistné
            období představuje časový úsek, po který je pojištění platné a za
            který se platí pojistné. První pojistné období začíná dnem počátku
            pojištění. Další období začíná dnem, který se svým číselným
            označením shoduje s datem počátku účinnosti pojištění; pokud takový
            den v měsíci neexistuje, použije se poslední den daného měsíce.
            Každé pojistné období končí dnem předcházejícím počátku
            následujícího období. Pojistná smlouva může být vypovězena ke konci
            pojistného období s výpovědní lhůtou šesti týdnů.
        lossPayeeClauseLevelObject:
          type: boolean
          description: >
            **Úroveň vinkulace**

            > **Definice:** Atribut se používá pouze tehdy, pokud je u produktu
            povolena vinkulace (lossPayeeClauseAllowed = true). Určuje, na jaké
            úrovni může být vinkulace evidována – smlouva, objekt nebo riziko.
            Pokud je tento atribut nastaven na true, znamená to, že vinkulace
            může být evidována na úrovni objektu. Současně platí, že jen jeden z
            atributů úrovně vinkulace (Smlouva / Objekt / Riziko) může mít
            hodnotu true.
        lossPayeeClauseLevelRisk:
          type: boolean
          description: >
            **Úroveň vinkulace riziko**

            > **Definice:** Atribut se používá pouze tehdy, pokud je u produktu
            povolena vinkulace (lossPayeeClauseAllowed = true). Definuje, na
            jaké úrovni může být vinkulace evidována – Smlouva / Objekt /
            Riziko. Pokud je tento atribut nastaven na true, znamená to, že
            vinkulace může být evidována na úrovni rizika. Současně platí, že
            jen jeden z atributů úrovně vinkulace (Smlouva / Objekt / Riziko)
            může mít hodnotu true.
        lossPayeeClauseLevelContract:
          type: boolean
          description: >
            **Úroveň vinkulace smlouva**

            > **Definice:** Atribut se používá pouze tehdy, pokud je u produktu
            povolena vinkulace (lossPayeeClauseAllowed = true). Definuje, na
            jaké úrovni může být vinkulace evidována – Smlouva / Objekt /
            Riziko. Pokud je tento atribut nastaven na true, znamená to, že
            vinkulace může být evidována na úrovni celé smlouvy. Současně platí,
            že jen jeden z atributů úrovně vinkulace (Smlouva / Objekt / Riziko)
            může mít hodnotu true.
        lossPayeeClauseAllowed:
          type: boolean
          description: >
            **Vinkulace povolena**

            > **Definice:** Atribut vyjadřuje, zda lze u daného produktu vázat
            výplatu pojistného plnění ve prospěch třetí osoby – obvykle věřitele
            pojištěného (např. banky poskytující úvěr). Vinkulace slouží jako
            forma zajištění pohledávky a zajišťuje, že případné pojistné plnění
            bude vyplaceno věřiteli namísto pojištěného. Běžně se používá u
            hypotečních úvěrů nebo jiných půjček na nemovitost, kde banka chrání
            svůj zájem na pojištěné věci. Pokud je atribut nastaven na true,
            může být v produktu dále určena úroveň vinkulace (Smlouva / Objekt /
            Riziko) pomocí příslušných atributů.
        roundBusinessRisk:
          type: boolean
          description: >
            **Zaokrouhlit obchodní rizika**

            > **Definice:** Atribut stanovuje, zda se pojistné (roční po
            slevách, lhůtní, alikvótní nebo první) zaokrouhluje hlavním nebo
            interním zaokrouhlením. Hodnota atributu ovlivňuje výpočet
            pojistného a slev na úrovni obchodních rizik, zejména při výpočtu:
            ročního pojistného, lhůtního pojistného, alikvótního pojistného,
            prvního pojistného.
        aliquotReductionOfPremium:
          type: boolean
        shortThermCalculationType:
          type: number
        productTemplate:
          type: string
          description: >
            **Šablona produktu**

            > **Definice:** Atribut vychází z číselníku „Šablona produktu“ a
            slouží k rozlišení hlavní kategorie pojištění, do které produkt
            spadá. Pomáhá systémově rozlišovat obchodní logiku, výpočty i
            zobrazování podle typu produktu. Možné hodnoty: PMP -> Pojištění
            majetku a odpovědnosti podnikatelů PMO -> Pojištění majetku a
            odpovědnosti občanů PMV -> Pojištění motorových vozidel IV->
            Pojištění osob ES -> Cestovní pojištění
        groupTariffVersion:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Verze sady sazebníků**

                > **Definice:** Atribut určuje, s jakou verzí sazebníků byla
                entita (produkt, objekt nebo obchodní riziko) sjednána. Je
                evidován na úrovni product, insuredObject a businessRisk. Při
                změně smlouvy může být: zachována původní sada sazebníků
                (identifikovaná touto hodnotou), nebopoužita aktuální sada
                sazebníků, přičemž se atribut aktualizuje na novou verzi. Na
                úrovni produktu určuje, kterou verzí sady sazebníků byla smlouva
                sjednána či naposledy přepočtena. Atribut je „in/out“ tedy
                přichází na vstupu, pokud je znám (např. uložená hodnota z
                předchozí kalkulace), a systém ho po výpočtu vrací zpět s
                případně aktualizovanou hodnotou.
        policy:
          allOf:
            - $ref: '#/components/schemas/PolicyBodyPD'
            - description: |
                **Atributy pro sjednání smlouvy**
                > **Definice:** Obsahuje staticke atributy pro sjednání smlouvy.
        attributes:
          allOf:
            - type: array
            - items:
                $ref: '#/components/schemas/FieldWithFIDPD'
            - description: >
                > **Definice:** Tento objekt obsahuje vnořené prvky využívající
                struktury
        insuranceLocation:
          allOf:
            - type: array
            - items:
                $ref: '#/components/schemas/InsuranceLocationPD'
            - description: >
                **Místo Pojištění**

                > **Definice:** Atribut představuje entitu určující konkrétní
                místo pojištění, které se následně přiřazuje jednotlivým
                pojištěným objektům. Místo pojištění může být definováno, pokud
                má pojištěný objekt fyzické umístění (např. budova, provozovna,
                nemovitost apod.). Pokud objekt nemá konkrétní místo pojištění,
                krytí se řídí územním rozsahem uvedeným v produktové definici.
                Produkt může mít: jedno nebo více míst pojištění, nebo žádné,
                pokud to povaha produktu nevyžaduje (např. pojištění osob či
                odpovědnosti). Další informace: viz dokument Místo pojištění na
                Confluence. Atribut určuje geografickou nebo věcnou lokalizaci
                pojištěných objektů a je základem pro vyhodnocení územní
                platnosti pojištění.
        productPartner:
          allOf:
            - type: array
            - items:
                $ref: '#/components/schemas/ProductPartnerPD'
            - description: >
                **Partner Produktu**

                > **Definice:** Atribut představuje entitu pro určení partnerů
                smlouvy a jejich rolí v rámci sjednaného produktu. Jedná se o
                povinnou entitu ve struktuře pojistné smlouvy. Role partnerů
                určují vztahy mezi účastníky smlouvy, které jsou definovány
                podle typu produktu. Platí předpoklad:1 smlouva = 1 produkt.
                Role mohou být přiřazeny: na úrovni produktu (smlouvy) –
                představují smluvní vztah (např. pojistník, pojištěný, oprávněná
                osoba),na úrovni pojištěného objektu – představují vztah ke
                konkrétnímu objektu (např. pojištěný majetek, provozovna,
                dopravní prostředek).Partner v roli může být: definovaný
                (existující v doméně Partner), nebo nedefinovaný (obecný vztah
                bez konkrétní osoby, např. všichni členové domácnosti).Každý
                produkt může mít definováno N rolí partnera, přičemž atributy
                role určují: povinnost existence (zda je role
                vyžadována),četnost výskytu (např. 1 pojistník, více
                pojištěných),úroveň vazby (produkt / objekt).Entita zajišťuje
                vazby mezi smlouvou, objekty a účastníky pojištění a určuje, v
                jaké roli daný partner na smlouvě vystupuje.
        productDiscountSurcharge:
          allOf:
            - type: array
            - items:
                $ref: '#/components/schemas/DiscountSurchargePD'
            - description: >
                **Sleva/Přirážka produktu**

                > **Definice:** Entita určuje, jaké slevy a přirážky je možné u
                produktu použít, za jakých podmínek a na jaké úrovni smlouvy.Z
                hlediska významu slouží k ovlivnění výsledné výše pojistného
                podle technických, obchodních nebo marketingových pravidel.Typy
                slev a přirážek:Technické – např. vyrovnávací sleva/přirážka z
                důvodu výpočtových nebo tarifních parametrů.Obchodní – přiděluje
                získatel, typicky podle svých oprávnění nebo prodejní
                strategie.Marketingové – automaticky aplikované systémem podle
                marketingových kampaní nebo produktových balíčků.Oceňovací (v
                životním pojištění) – např. přirážka za zdravotní stav,
                rozhoduje underwriting nebo systémové vyhodnocení.Řízení a
                aplikace:Každá sleva/přirážka je jednoznačně identifikována
                kódem a názvem.Na obchodním produktu je definováno, které
                slevy/přirážky jsou dostupné, jak se aplikují a v jakém rozsahu
                (částka nebo procento).Nastavení je řízeno produktem, ale
                obchodní slevy lze upravit v modulu slev pro konkrétní
                uživatele.Slevy a přirážky lze uplatnit na různých
                úrovních:smlouvy,pojištěného objektu,obchodního nebo
                elementárního rizika.Výsledné hodnoty:Eviduje se přidělená
                sleva/přirážka a vypočítaná částka dle báze kalkulace
                pojistného:sleva na kalkulovaném, ročním nebo alikvótním
                pojistném,zvlášť i sleva na první pojistné.Systém vyhodnocuje
                výsledné pojistné po slevách a přirážkách na všech úrovních
                (smlouva, balíček, rizika).Další informace: viz dokument
                SLEVA/PŘIRÁŽKA na Confluence – obsahuje detailní seznam atributů
                a pravidel.Entita slouží k centralizované správě všech typů slev
                a přirážek v rámci produktové definice, a určuje jejich vliv na
                kalkulaci výsledného pojistného.
        insuredObject:
          allOf:
            - type: array
            - items: null
              $ref: '#/components/schemas/InsuredObjectPD'
            - description: >
                **Pojištený objekt** 

                > **Definice:** Slouží k definici pojištěných objektů v rámci
                pojistné smlouvy. Entita představuje pojištěný objekt, na který
                se vztahuje pojistné krytí sjednaného produktu. Každá pojistná
                smlouva může obsahovat jeden nebo více pojištěných objektů,
                podle charakteru produktu.
        coinsurability:
          type: array
          items:
            $ref: '#/components/schemas/CoinsurabilityItemPD'
        productLimit:
          type: array
          items:
            $ref: '#/components/schemas/LimitPD'
        validation:
          allOf:
            - type: array
            - items:
                $ref: '#/components/schemas/ValidationPD'
            - description: |
                **Validace** 
                > **Definice:**
        constraint:
          allOf:
            - type: array
            - items:
                $ref: '#/components/schemas/ConstraintPD'
            - description: >
                **Omezení** 

                > **Definice:** Umožňuje definovat specifická pravidla, která
                omezují povolené kombinace nebo hodnoty atributů. Používá se
                zejména tam, kde je potřeba společné pravidlo pro více atributů
                nebo kde není vhodné řešit kontrolu pomocí jednotlivých
                validací.
        attachment:
          allOf:
            - type: array
            - items:
                $ref: '#/components/schemas/AttachmentPD'
            - description: >
                > **Definice:** Příloha včetně podmínek nadefinovaná na úrovni
                smlouvy
        staticDoc:
          allOf:
            - type: array
            - items:
                $ref: '#/components/schemas/StaticDocPD'
            - description: >
                > **Definice:** Umožňuje centrálně definovat statické dokumenty
                pojistné smlouvy (např. pojistné podmínky, informační dokumenty)
                a následně je automaticky přiřazovat ke smlouvě nebo k nižším
                entitám (např. pojištěnému objektu).
        specialAgreement:
          allOf:
            - type: array
            - items: null
              $ref: '#/components/schemas/SpecialAgreementPD'
            - description: |
                > **Definice:**
        freeAgreement:
          allOf:
            - $ref: '#/components/schemas/FreeAgreementPD'
            - description: >
                > **Definice:** Ukazuje, kde v produktové struktuře jsou volná
                zvláštní ujednání definována
        extendedData:
          $ref: '#/components/schemas/EntityExtendedDataPD'
        businessActivity:
          type: array
          items:
            $ref: '#/components/schemas/BusinessActivityPD'
        registeredBusinessActivity:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredBusinessActivityPD'
        AMLCheck:
          type: boolean
        CRSCheck:
          type: boolean
        FATCACheck:
          type: boolean
        taxAllowancesProduct:
          type: string
        techInterestRate:
          type: number
        premiumEmployerAllowed:
          type: boolean
        delayPeriodTransfer:
          type: boolean
        authorizedMortgageeConsent:
          type: boolean
    InceptionDateAndTimeRulesPD:
      type: object
      description: >
        > **Definice:** seskupují atributy které definují pravidla pro chování
        datumu počátku při sjednání smlouvy

        > **[Konfigurace časových
        pravidel](#tag/Konfigurace-casovych-pravidel)**.
      properties:
        variableInceptionDateAllowed:
          type: boolean
        retroactiveInceptionDateAllowed:
          type: boolean
        inceptionTimeIsInput:
          type: boolean
          description: >
            **Čas data počátku je vstup**


            > **Definice:** Pokud je hodnota nastavena na true, systém umožní
            uživateli zadat i čas počátku účinnosti.Pokud je nastavena na false,
            čas se automaticky nastaví na 00:00 Atribut souvisí s polem
            inceptionTime – tento údaj se v odpovědi (response) produktu Domex+
            nevyskytuje.Pro produkt Domex+ je výchozí hodnota false.
        inceptionDateFrom:
          type: string
          format: date-time
          description: >
            **Dátum počátku od**

            > **Definice:** Hodnota se vypočítá jako:maximum (TODAY + Minimální
            počet dní do data počátku, Minimální datum počátku účinnosti PS).Tím
            se zajistí, že počátek pojištění nelze nastavit dříve, než je
            systémem nebo produktem povoleno.
        inceptionDateTo:
          type: string
          format: date-time
          description: >
            **Datum počátku do**

            > **Definice:** Hodnota se počítá jako: TODAY + Maximální počet dní
            do data počátku.Ve výjimečných případech může být výsledné Datum
            počátku do menší než Datum počátku od, což znamená, že nelze
            aktuálně smlouvu sjednat (např. když je minimální datum počátku
            nastaveno daleko do budoucna).
        inceptionDateFromRetroactive:
          type: string
          format: date-time
          description: >
            **Datum počátku od pro zpětný počátek**

            > **Definice:**  předává informaci jaké je minimální Datum počátku
            účinnosti PS vzhledem k TODAY je-li na smlouvě současně povolen
            zpětný počátek (Příznak zpětného posunu počátku = true).Pokud je
            Zpětný posun počátku povolen true pak se vypočítá jako maximum(TODAY
            - Maximální počet dní posunu Minimální datum počátku účinnosti PS)
            jinak se spočítá jako maximum(TODAY + Minimální počet dní do data
            počátku Minimální datum počátku účinnosti PS) (tzn. stejně jako CAL
            Datum počátku od).
        inceptionDateToRetroactive:
          type: string
          format: date-time
          description: >
            **Datum počátku do pro zpětný počátek**

            > **Definice** předává informaci jaké je maximální Datum počátku
            účinnosti PS vzhledem k TODAY je-li na smlouvě současně povolen
            zpětný počátek (Příznak zpětného posunu počátku = true).Vždy se
            vypočítá shodně jako CAL Datum počátku do, tzn. TODAY + Maximální
            počet dní do data počátku (v budoucnu je možné, že by mohlo být
            vyhodnocováno jinak, a proto byl raději vyhrazen samostatný
            atribut).
        methodForInception:
          type: string
          description: >
            **Metoda pro určení data počátku**

            > **Definice:** Atribut kterým se bude řídit jakým způsobem se bude
            pracovat s datem počátku účinnosti PS.Pokud je tato hodnota
            nastavena na 1 tak se zobrazují atributy inception DateInput a
            termination DateInput.Číselník: lov method for_inceptionV domex je
            hodnota 1 co znaci ze Datum zadáno uživatelem jako vstup
        allowedDates:
          type: array
          items:
            type: object
            properties:
              allowedDate:
                type: string
                format: date-time
    PolicyBodyPD:
      type: object
      properties:
        proposalPresentationDate:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Datum předložení návrhu**

                > **Definice:** Atribut určuje okamžik, kdy byl návrh pojistné
                smlouvy předložen klientovi. Hodnota je v systému automaticky
                evidována (datum i čas) a na frontendu se zobrazuje jako
                needitovatelné šedé pole. Slouží jako vstupní parametr pro
                kalkulaci pojistné smlouvy.
        inceptionDateInput:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Datum počátku účinnosti PS**

                > **Definice:** Atribut určuje datum, kdy končí účinnost
                pojistné smlouvy (PS). Jedná se o poslední den, kdy je platné
                některé z rizik po jeho uplynutí smlouva zaniká. Atribut se
                používá pro zadání data konce uživatelem, ale pouze u produktů,
                kde má atribut methodForFixedPeriod hodnotu 2 („Datum zadáno
                uživatelem jako vstup“). Pro Domex je hodnota 3 (na rok) Pokud
                tato metoda na technickém produktu není povolena, atribut nebude
                v produktu zahrnut.
        inceptionDate:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Datum počátku účinnosti PS**

                > **Definice:** Atribut představuje okamžik, od kterého je
                pojistná smlouva účinná. Datum počátku může být nastaveno před,
                k nebo po datu předložení návrhu či uzavření smlouvy. Obvykle od
                tohoto data začínají platit rizika, ale může existovat i
                smlouva, která je účinná bez platných rizik. U některých
                produktů je možné datum počátku zadat zpětně (tzv. zpětný posun
                počátku). Na produktu jsou definovány limity: minimální a
                maximální počet dní mezi datem předložení návrhu a datem počátku
                účinnosti, metoda pro určení data počátku (methodForInception),a
                pravidlo, zda se zadává i čas počátku účinnosti
                (inceptionTimeIsInput). Časová složka se určuje takto: pokud je
                datum počátku = today, vloží se aktuální čas, jinak se použije
                čas 00:00.Na úrovni smlouvy je atribut uložen jako jedna hodnota
                typu datetime, která kombinuje datum i čas počátku účinnosti.
        terminationDateInput:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Datum konce PS**

                > **Definice:** Atribut určuje datum, kdy končí účinnost
                pojistné smlouvy (PS). Jedná se o poslední den, kdy je platné
                některé z rizik po jeho uplynutí smlouva zaniká. Atribut se
                používá pro zadání data konce uživatelem, ale pouze u produktů,
                kde má atribut methodForFixedPeriod hodnotu 2 („Datum zadáno
                uživatelem jako vstup“). Pro Domex je hodnota 3 (na rok) Pokud
                tato metoda na technickém produktu není povolena, atribut nebude
                v produktu zahrnut.
        terminationDate:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Datum konce PS**

                > **Definice:** Atribut představuje poslední den, kdy je ještě
                platné některé z rizik na pojistné smlouvě. Po ukončení tohoto
                dne zaniká poslední riziko a tím i celá pojistná smlouva. Datum
                konce PS stanovené při sjednání nemusí být konečné — u některých
                produktů existuje možnost: automatické prolongace (prodloužení o
                další rok),zkrácení nebo prodloužení pojistné doby,¨nebo jiné
                funkcionality ovlivňující délku trvání pojištění. Při stornu
                smlouvy se datum konce nemění. U smluv na dobu neurčitou se
                nastavuje hodnota 31. 12. 2999. U smluv na dobu určitou závisí
                výpočet na atributu methodForFixedPeriod, který určuje metodu
                stanovení data konce. Časová složka atributu je vždy nastavena
                na 23:59.
        conclusionDate:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Datum uzavření PS**

                > **Definice:** Datum uzavření PS je legislativním datem, od
                kterého: začíná platnost Pojistné smlouvy, běží lhůty pro
                odstoupení nebo výpověď smlouvy. Způsob akceptace návrhu závisí
                na nastavení atributu methodConcludingContract (Metoda uzavření
                smlouvy).V systému je evidováno datum i čas uzavření pojistné
                smlouvy.
        contractualDocumentationCreationDate:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Datum vytvoření smluvní dokumentace**

                > **Definice:** Atribut představuje okamžik, kdy byl z Modelace
                nebo Kalkulace pojistné smlouvy (SUS+) vytvořen Návrh pojistné
                smlouvy. Tento okamžik zároveň znamená, že z kalkulaček v SUS+
                byla předána data návrhu pojistné smlouvy do systému a zahájen
                proces akceptace. V systému je evidováno datum i čas vytvoření
                smluvní dokumentace.
        coveragePeriod:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Pojistná doba**

                > **Definice:** Atribut vyjadřuje, na jak dlouho je pojištění
                uzavřeno. Rozlišují se dva základní typy pojistné doby: Doba
                neurčitá pojištění trvá, dokud není smlouva ukončena. Doba
                určitá pojištění je sjednáno na pevně stanovené období (např. v
                letech, měsících nebo dnech).Hodnoty jsou řízeny číselníkem
                POJISTNÁ DOBA (lov_coverage_period).
        coveragePeriodOutput:
          $ref: '#/components/schemas/FieldPD'
        paymentFrequency:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Frekvence placení**

                > **Definice:** Atribut vyjadřuje, jak často je pojistné hrazeno
                v rámci sjednané pojistné smlouvy. Možné hodnoty představují
                obvyklé způsoby úhrady, např.: roční, pololetní, čtvrtletní,
                měsíční, jednorázová platba. Hodnoty jsou řízeny číselníkem
                FREKVENCE PLACENÍ (lov_payment_frequency).
        methodConcludingContract:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Metoda uzavření smlouvy**

                > **Definice:** Atribut identifikuje, zda byla smlouva uzavřena
                podpisem nebo platbou, a zároveň určuje konkrétní způsob tohoto
                úkonu, např.: vlastnoruční podpis, digitální podpis, zaručený
                elektronický podpis, BANK ID, platba převodem nebo na platebním
                místě. Atribut je vstupní (input), ale během přepočtu smlouvy
                mohou být — na základě definovaných podmínek — povolené metody
                automaticky upraveny nebo omezeny podle parametrů dané smlouvy.
                Hodnoty jsou řízeny číselníkem METODA UZAVŘENÍ SMLOUVY
                (lov_method_concluding_contract).
        proposalAcceptanceDeadline:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Termín pro přijetí návrhu**

                > **Definice:** Atribut vyjadřuje poslední možný okamžik pro
                akceptaci návrhu pojistné smlouvy ze strany pojistníka. Pokud
                nedojde k přijetí návrhu do tohoto termínu, návrh zaniká. Na
                produktu jsou definována pravidla pro určení termínu v
                závislosti na: Metodě uzavření smlouvy
                (methodConcludingContract), dalších vlastnostech smlouvy (např.
                variabilní počátek, maximální počet dní pro přijetí návrhu).V
                některých případech nemusí být termín stanoven, pak je technicky
                uloženo systémové datum a čas na neurčito. V systému je vždy
                evidováno datum i čas termínu pro přijetí návrhu
        arrangementType:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Typ sjednání**

                > **Definice:** Atribut specifikuje, zda je sjednávaná smlouva
                nová, náhradní nebo obnovovaná.
        legislationVersion:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Verze legislativy**

                > **Definice:** Atribut udává, kterými obecnými právními
                předpisy se daná pojistná smlouva řídí. Slouží k rozlišení
                právních režimů podle příslušné legislativy platné v době
                sjednání smlouvy. Hodnoty jsou řízeny číselníkem VERZE
                LEGISLATIVY (lov_legislation_version),
        annualDay:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Den výročí**

                > **Definice:** Atribut představuje den výročí pojistné smlouvy,
                který — spolu s atributem annualMonth — určuje významný den v
                roce, od kterého se odvíjí klíčové datumové položky smlouvy,
                jako např.: splatnost pojistného, hranice pojistného roku,
                výpovědní lhůty. Výroční den se obvykle odvozuje z data počátku
                smlouvy. U flotilových smluv může být odvozen z počátku flotily,
                i když počátek konkrétní smlouvy je jiný — všechny termíny
                (splatnosti, výpovědi) se ale dále řídí právě tímto výročním
                dnem. První předpis pojistného může být v takovém případě
                alikvotně krácen, aby pokrýval období od počátku po nejbližší
                výroční den. V systému jsou uloženy dva atributy: Den výročí
                (annualDay), Měsíc výročí (annualMonth). Výroční den PS se pak
                tvoří jako kombinace:Den výročí + Měsíc výročí + aktuální rok.
                Atribut se vyplňuje pouze u běžně placených smluv. U jednorázově
                placených smluv není vyplněn, protože by mohl působit matoucím
                dojmem (smlouvy mohou trvat déle než jeden rok).Atribut slouží k
                určení výročního dne pojistné smlouvy a k výpočtu následných
                termínů splatnosti a výpovědí.
        annualMonth:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Měsíc výročí**

                > **Definice:** Atribut představuje měsíc výročí pojistné
                smlouvy, podle kterého se odvíjejí všechny další datumové
                položky smlouvy, jako např.: splatnost pojistného, hranice
                pojistného roku, výpovědní lhůty. Výroční den se obvykle
                odvozuje z data počátku smlouvy. U flotilových smluv může být
                odvozen z počátku flotily, přičemž i v takovém případě se další
                data (splatnosti, výpovědi) řídí tímto výročním dnem. První
                předpis pojistného může být alikvotně krácen, aby pokrýval
                období od počátku po nejbližší výroční den. V systému jsou
                uloženy dva atributy:Den výročí (annualDay),Měsíc výročí
                (annualMonth). Aktuální výroční den PS se určuje jako kombinace:
                Den výročí + Měsíc výročí + aktuální rok. Atribut se vyplňuje
                pouze u běžně placených smluv. U jednorázově placených smluv
                není vyplněn, protože může být zavádějící (smlouvy mohou
                přesahovat jeden rok).Atribut slouží k určení měsíce výročí
                pojistné smlouvy, od kterého se odvíjí všechny časové události
                spojené s pojistnou smlouvou.
        negotiationWay:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Způsob jednání**

                > **Definice:** Atribut vyjadřuje, zda byla smlouva sjednána
                osobně nebo na dálku, přičemž rozlišuje i místo prodeje (obvyklé
                / neobvyklé). Zvolený způsob jednání má zásadní vliv na práva a
                povinnosti smluvních stran, zejména na možnost odstoupení od
                smlouvy. Hodnoty jsou řízeny číselníkem ZPŮSOB JEDNÁNÍ
                (lov_negotiation_way), např.: P: Na místě obvyklém prodeji
                (prezenčně), N: Na místě neobvyklém prodeji, D: Na dálku
                (distančně), M: Na místě (ostatní specifikace). Atribut je
                důležitý pro vyhodnocení právních podmínek a lhůt spojených se
                sjednáním a odstoupením od pojistné smlouvy.
        paymentMethod:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Platební metoda**

                > **Definice:** Atribut specifikuje platební metodu, kterou bude
                pojistník používat pro úhradu běžného pojistného (např. měsíční
                nebo roční platby).Příklady možných hodnot :bankovní převod,
                inkaso z účtu, SIPO, platební brána apod. Pro první nebo
                jednorázové pojistné se tento atribut neeviduje. Poznámka:
                Platební metoda (paymentMethod) není totožná s atributem
                methodConcludingContract (Metoda uzavření smlouvy). Ten
                popisuje, jak byla smlouva uzavřena (např. podpisem nebo
                platbou), zatímco tento atribut popisuje jak bude hrazeno
                pojistné po uzavření smlouvy. Hodnoty jsou řízeny číselníkem
                PLATEBNÍ METODA (lov_payment_method).Atribut určuje technický
                způsob úhrady pojistného a ovlivňuje proces zpracování plateb v
                systému.
        fixationFromDate:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Datum fixace od**

                > **Definice:** Atribut se používá pouze v případě, že produkt
                umožňuje fixaci nabídky(viz atribut offerFixationAllowed) a že
                uživatel má v KNZ/SUS+ oprávnění tuto funkčnost využít.Pokud je
                fixace provedena, v doméně CAL se ukládají datumy od kdy a do
                kdy je nabídka fixována .Pro doménu PRD je však dostačující
                pouze informace „od kdy“ je fixace aktivní, což je právě hodnota
                tohoto atributu. Pokud produkt neumožňuje fixaci nabídky,
                atribut nebude na produktu zahrnut. Atribut určuje okamžik, od
                kterého je nabídka pojistné smlouvy zafixována podle oprávnění a
                nastavení produktu.
        automaticProlongation:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Příznak automatické prolongace**

                > **Definice:** Atribut představuje příznak automatické
                prolongace pojistné smlouvy.Je sbírán pouze v případě, že
                produkt automatickou prolongaci podporuje(viz atribut
                „Automatická prolongace povolena“).Pokud je hodnota nastavena na
                true, smlouva se po uplynutí pojistné doby automaticky prodlouží
                na další období bez nutnosti zásahu klienta. Pokud je hodnota
                false, smlouva po skončení zaniká. Pokud produkt nepovoluje
                automatickou prolongaci, tento atribut nebude v produktu
                obsažen. Atribut určuje, zda se pojistná smlouva obnovuje
                automaticky po skončení svého pojistného období.
        indexation:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Příznak indexace**

                > **Definice:** Atribut představuje příznak indexace pojistné
                smlouvy. Používá se pouze tehdy, pokud produkt indexaci
                podporuje(viz atribut „Indexace povolena“).Pokud je hodnota
                nastavena na true, smlouva bude automaticky indexována podle
                pravidel daných produktem (např. o inflaci nebo stanovené
                procento).Pokud je hodnota false, smlouva zůstává beze změny a
                indexace se neuplatní. Pokud produkt nepovoluje indexaci,
                atribut nebude v produktu zahrnut. Atribut určuje, zda se má na
                dané smlouvě uplatnit každoroční valorizace podle produktových
                pravidel.
        variableInceptionDate:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Příznak variabilního počátku**

                > **Definice:** Atribut představuje příznak variabilního počátku
                účinnosti pojistné smlouvy. Používá se pouze tehdy, pokud
                produkt povoluje variabilní počátek (viz atribut „Variabilní
                počátek povolen“ – variableInceptionDateAllowed). Pokud je
                hodnota nastavena na true, datum počátku účinnosti pojistné
                smlouvy se neurčuje při sjednání, ale až později při akceptaci
                návrhu pojistníkem. Pokud je hodnota false, počátek účinnosti se
                stanoví přímo při sjednání smlouvy. Pokud produkt nepovoluje
                variabilní počátek, atribut nebude na produktu zahrnut. Atribut
                určuje, zda se datum počátku účinnosti smlouvy zadává při
                sjednání, nebo až následně po akceptaci.
        retroactiveInceptionDate:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Příznak zpětného posunu počátku**

                > **Definice:** Atribut představuje příznak zpětného počátku
                účinnosti pojistné smlouvy. Používá se pouze tehdy, pokud
                produkt umožňuje zpětný posun počátku(viz atribut „Zpětný posun
                počátku povolen“ – retroactiveInceptionDateAllowed)a pokud má
                uživatel v systému KNZ/SUS+ odpovídající oprávnění. Pokud je
                hodnota nastavena na true, znamená to, že uživatel vědomě
                požádal o zpětné nastavení počátku účinnosti smlouvy, a systém
                proto uplatní specifické validace a kontroly datumů. Pokud je
                hodnota false, smlouva se řídí běžnými validačními pravidly.
                Pokud produkt neumožňuje zpětný počátek, atribut nebude na
                produktu zahrnut .Atribut označuje, zda má být pojištění účinné
                zpětně a aktivuje speciální kontrolní logiku na datumová pole.
        voucher:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Voucher**

                > **Definice:** Atribut představuje technický identifikátor
                voucheru, který určuje, jaký typ voucheru a s jakými parametry
                se má na dané smlouvě použít. Produkt v rámci své definice
                určuje, jak se má s daným typem voucheru zacházet – např. jaký
                vliv má na kalkulaci, slevy nebo další parametry smlouvy. Tyto
                definice jsou zpracovávány postupně podle požadavků na použití
                voucherů. Na jedné pojistné smlouvě může být použit pouze jeden
                voucher, i když může ovlivňovat více parametrů produktu. Hodnoty
                jsou řízeny číselníkem VOUCHER (lov_voucher).Atribut umožňuje
                aplikaci slev nebo speciálních podmínek prostřednictvím
                definovaného typu voucheru.
        classifiedContractData:
          $ref: '#/components/schemas/FieldPD'
        yearNumber:
          allOf:
            - $ref: '#/components/schemas/FieldPD'
            - description: >
                **Počet let**

                > **Definice:** Atribut slouží k uživatelskému zadání délky
                pojistné doby v letech. Používá se pouze u produktů, kde má
                atribut methodForFixedPeriod(Metoda určení data konce pro dobu
                určitou) hodnotu 1 Dle počtu let. Na základě zadaného počtu let
                se následně automaticky vypočítá Datum konce pojistné smlouvy
                (PS). Pokud produkt nepoužívá metodu 1  Dle počtu let, tento
                atribut nebude na produktu zahrnut. Atribut umožňuje výpočet
                konce pojistné smlouvy podle počtu let trvání zadaného
                uživatelem.
